# @package _global_
benchmark:
  name: text8
  data_dir: data/lm/text8
  context_length: 256
  tokenizer:
    name: byte
  files:
    train: train.bin
    raw: text8
    val: val.bin
    test: test.bin
  splits:
    train_bytes: 90000000
    val_bytes: 5000000
    test_bytes: 5000000
model:
  name: lm_text8
  hidden_size: 768
  n_layers: 12
  n_heads: 12
  ffn_hidden_size: 3072
  dropout: 0.1
  use_timestep_conditioning: true
train:
  # Lower-memory base split. Publication configs override this to 64 x 8.
  batch_size: 32
  grad_accum_steps: 16
  beta1: 0.9
  beta2: 0.95
  lr: 0.0003
  lr_schedule:
    enabled: true
    warmup_steps: 10000
    min_lr: 1.0e-05
  max_grad_norm: 1.0
  n_steps: 500_000
  resume_from: null
  save_every: 5000
  weight_decay: 0.1
eval:
  batch_size: 8
  eval_every: 10000
  generate_curves: true
  log_conservation_integral: true
  steps_per_batch: 4
  primary_split: val
  report_splits:
  - val
  - test
logging:
  enabled: true
  entity: null
  group: poc_text8
  log_every: 100
  mode: online
  print_every: 5000
  project: gexit-diffusion
  resume: never
  run_id: null
  wandb_id: null
paths:
  checkpoint_dir_name: checkpoints
  checkpoint_filename_template: model_step_{step:07d}.pt
  config_snapshot_name: config.yaml
  history_filename: train_history.csv
  metrics_filename: metrics.json
  model_filename: model.pt
  wandb_dir_name: wandb
seed: 2026
device: auto
deterministic: false
verbose: false
